<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Registration | Nova Rise Academy</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #17154b, #4b3bd4);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 8px;
}

.logo span {
  color: #6555e8;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #6555e8;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #6555e8;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #5142c9;
}

.links {
  text-align: center;
  margin-top: 20px;
  line-height: 1.8;
}

.links a {
  color: #6555e8;
  text-decoration: none;
  font-weight: bold;
}

.notice {
  margin-top: 18px;
  padding: 12px;
  background: #f4f3ff;
  border-radius: 10px;
  color: #555;
  font-size: 13px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Nova Rise <span>Academy</span>
  </div>

  <div class="subtitle">
    Create your Member Account
  </div>

  <form id="registerForm">

    <label>Full Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <label>Gmail / Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your Gmail"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="6"
      required
    >

    <label>Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      minlength="6"
      required
    >

    <button type="submit">Create Account</button>

  </form>

  <div class="links">
    Already have an account?
    <a href="login.html">Login</a>
    <br>
    <a href="index.html">Back to Home</a>
  </div>

  <div class="notice">
    Your account information is securely handled through Nova Rise Academy's authentication system.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://tvjvjkafefkiqlpijbj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_UjQADEqyQfxhJjHZx_p7Ng_pMLdqgIK"

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("registerForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: name
      }
    }
  });

  if (error) {
    alert("Registration failed: " + error.message);
    return;
  }

  alert("Account created successfully! Please check your email if verification is required.");

  window.location.href = "login.html";

});

</script>

</body>
</html>
